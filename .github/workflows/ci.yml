name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp -Daether.connector.http.retryHandler.count=6 -Daether.connector.http.retryHandler.interval=10000 verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/*/target/surefire-reports/
          retention-days: 7

  engines:
    name: Analytics engines (Trino, StarRocks, Doris, ClickHouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the engine images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Kernel settings Doris and StarRocks backends expect
        run: sudo sysctl -w vm.max_map_count=2000000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Engine tests
        working-directory: backend
        run: |
          mvn -B -ntp -q -Daether.connector.http.retryHandler.count=6 install -DskipTests
          mvn -B -ntp -pl opendbapi-app test -Dtest.excludedGroups=none -Dgroups=engines -Dsurefire.failIfNoSpecifiedTests=false
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-reports
          path: backend/opendbapi-app/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated client matches openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/generated || { echo "::error::Run 'npm run gen:api' and commit src/api/generated"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: lint and render
        run: |
          helm lint deploy/helm/opendbapi --set database.url=jdbc:postgresql://pg/opendbapi \
            --set secrets.dbPassword=x --set secrets.dbOwnerPassword=x --set secrets.masterKey=x
          helm template ci deploy/helm/opendbapi --set database.url=jdbc:postgresql://pg/opendbapi \
            --set existingSecret=s --set ingress.enabled=true --set autoscaling.enabled=true > /dev/null

  image:
    name: Image + end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: opendbapi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start PostgreSQL and the image
        run: |
          docker compose -f deploy/dev/docker-compose.yml up -d --wait postgres
          docker run -d --name opendbapi --network host \
            -e OPENDBAPI_DB_URL=jdbc:postgresql://localhost:55432/opendbapi \
            -e OPENDBAPI_DB_PASSWORD=app -e OPENDBAPI_DB_OWNER_PASSWORD=owner \
            -e OPENDBAPI_MASTER_KEY="$(openssl rand -base64 32)" \
            -e OPENDBAPI_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-password \
            -e OPENDBAPI_SECURE_COOKIES=false \
            opendbapi:ci
          for i in $(seq 1 60); do
            curl -fs http://localhost:8520/actuator/health/readiness && exit 0
            sleep 2
          done
          docker logs opendbapi
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        env:
          OPENDBAPI_E2E_BASE_URL: http://localhost:8520
          OPENDBAPI_E2E_ADMIN_PASSWORD: ci-admin-password
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Command line in the image
        run: |
          docker run --rm opendbapi:ci help | grep -q "Usage: opendbapi"
      - name: App log
        if: failure()
        run: docker logs opendbapi
      - name: Image tags
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
