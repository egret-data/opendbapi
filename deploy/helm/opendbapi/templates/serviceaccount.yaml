{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opendbapi.serviceAccountName" . }}
  labels:
    {{- include "opendbapi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Vault's Kubernetes auth reads the pod's service account token.
automountServiceAccountToken: {{ and .Values.vault.address (eq .Values.vault.auth "kubernetes") | ternary "true" "false" }}
{{- end }}
