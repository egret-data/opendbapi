{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opendbapi.fullname" . }}
  labels:
    {{- include "opendbapi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secretKeys.dbPassword }}: {{ required "secrets.dbPassword (or existingSecret) is required" .Values.secrets.dbPassword | quote }}
  {{ .Values.secretKeys.dbOwnerPassword }}: {{ required "secrets.dbOwnerPassword (or existingSecret) is required" .Values.secrets.dbOwnerPassword | quote }}
  {{ .Values.secretKeys.masterKey }}: {{ required "secrets.masterKey (or existingSecret) is required: openssl rand -base64 32" .Values.secrets.masterKey | quote }}
  {{ .Values.secretKeys.bootstrapAdminPassword }}: {{ .Values.secrets.bootstrapAdminPassword | quote }}
{{- end }}
