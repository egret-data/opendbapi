# Default values for OpenDBAPI. Every pod is identical: sessions, HMAC nonces and cache
# invalidation are shared through PostgreSQL, so scale with replicaCount or the autoscaler.

replicaCount: 2

image:
  repository: ghcr.io/egret-data/opendbapi
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# PostgreSQL 14+ that OpenDBAPI stores its own data in (not the databases it serves).
# Two roles: the owner runs the migrations, the app role is subject to row-level security.
#   CREATE ROLE opendbapi_owner LOGIN PASSWORD '...';
#   CREATE ROLE opendbapi_app LOGIN PASSWORD '...' NOBYPASSRLS;
#   ALTER DATABASE opendbapi OWNER TO opendbapi_owner;
database:
  url: ""            # required, e.g. jdbc:postgresql://postgres:5432/opendbapi
  user: opendbapi_app
  ownerUser: opendbapi_owner

# Passwords and keys. Either name an existing Secret with the keys below, or let the chart
# create one from `secrets.*` (fine for a trial; prefer your own Secret in production).
existingSecret: ""
secretKeys:
  dbPassword: db-password
  dbOwnerPassword: db-owner-password
  masterKey: master-key                   # 32 random bytes, base64: openssl rand -base64 32
  bootstrapAdminPassword: bootstrap-admin-password
secrets:
  dbPassword: ""
  dbOwnerPassword: ""
  masterKey: ""
  bootstrapAdminPassword: ""   # empty: a random one is printed once in the first pod's log

# Rate limits counted once across all pods (in PostgreSQL) rather than per pod.
rateLimit:
  shared: true

# Cookies need HTTPS; turn off only for plain-HTTP trials.
secureCookies: true

# HashiCorp Vault for vault:PATH#KEY references (spec §4.5). Each workspace may only read
# paths under allowedPaths, where {workspace} is its slug. With auth kubernetes, Vault's
# Kubernetes auth role must trust this release's service account (serviceAccount.create).
vault:
  address: ""                # e.g. https://vault.example.com:8200; empty disables vault: references
  auth: kubernetes           # kubernetes | approle | token
  role: ""                   # kubernetes auth role
  loginMount: ""             # defaults to kubernetes / approle
  namespace: ""              # Vault Enterprise namespace
  kvVersion: 2
  allowedPaths: "secret/opendbapi/{workspace}/"
  systemPaths: "secret/opendbapi/system/"
  # token or approle: keys of existingSecret (or the chart's Secret) holding the credentials
  tokenKey: vault-token
  roleIdKey: vault-role-id
  secretIdKey: vault-secret-id

# Extra environment, e.g. LDAP/OIDC settings or Spring properties.
env: []
envFrom: []

javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1536Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opendbapi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Prometheus scraping of /actuator/prometheus.
metrics:
  podAnnotations: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
