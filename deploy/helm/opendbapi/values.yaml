# Default values for OpenDBAPI. Every pod is identical: sessions, HMAC nonces and cache
# invalidation are shared through PostgreSQL, so scale with replicaCount or the autoscaler.

replicaCount: 2

image:
  repository: ghcr.io/egret-data/opendbapi
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# PostgreSQL 14+ that OpenDBAPI stores its own data in (not the databases it serves).
# Two roles: the owner runs the migrations, the app role is subject to row-level security.
#   CREATE ROLE opendbapi_owner LOGIN PASSWORD '...';
#   CREATE ROLE opendbapi_app LOGIN PASSWORD '...' NOBYPASSRLS;
#   ALTER DATABASE opendbapi OWNER TO opendbapi_owner;
database:
  url: ""            # required, e.g. jdbc:postgresql://postgres:5432/opendbapi
  user: opendbapi_app
  ownerUser: opendbapi_owner

# Passwords and keys. Either name an existing Secret with the keys below, or let the chart
# create one from `secrets.*` (fine for a trial; prefer your own Secret in production).
existingSecret: ""
secretKeys:
  dbPassword: db-password
  dbOwnerPassword: db-owner-password
  masterKey: master-key                   # 32 random bytes, base64: openssl rand -base64 32
  bootstrapAdminPassword: bootstrap-admin-password
secrets:
  dbPassword: ""
  dbOwnerPassword: ""
  masterKey: ""
  bootstrapAdminPassword: ""   # empty: a random one is printed once in the first pod's log

# Cookies need HTTPS; turn off only for plain-HTTP trials.
secureCookies: true

# Extra environment, e.g. LDAP/OIDC settings or Spring properties.
env: []
envFrom: []

javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1536Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opendbapi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Prometheus scraping of /actuator/prometheus.
metrics:
  podAnnotations: true

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
