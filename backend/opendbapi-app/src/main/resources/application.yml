opendbapi:
  mode: standalone
  # Base64 of 32 random bytes (openssl rand -base64 32). Needed to store secrets as enc:.
  master-key: ${OPENDBAPI_MASTER_KEY:}
  auth:
    local-enabled: true
    bootstrap-admin-password: ${OPENDBAPI_BOOTSTRAP_ADMIN_PASSWORD:}
  serving:
    context: api
    url-base: ""
    # Statements slower than this are logged (rendered SQL, no parameter values; spec §18).
    slow-query-ms: 1000
  access-log:
    # Spec §19: rows in access_log are kept this many days.
    retention-days: 30

spring:
  application:
    name: opendbapi
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${OPENDBAPI_DB_URL:jdbc:postgresql://localhost:55432/opendbapi}
    # Application role: subject to row-level security (spec §4.0).
    username: ${OPENDBAPI_DB_USER:opendbapi_app}
    password: ${OPENDBAPI_DB_PASSWORD}
    hikari:
      connection-init-sql: set search_path to opendbapi
  flyway:
    # Migrations run as the schema owner, never as the application role.
    user: ${OPENDBAPI_DB_OWNER:opendbapi_owner}
    password: ${OPENDBAPI_DB_OWNER_PASSWORD}
    schemas: opendbapi
    placeholders:
      app_role: ${OPENDBAPI_DB_USER:opendbapi_app}
  # Directories are configured per identity provider (spec §8.5), never as one global LDAP.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.ldap.LdapAutoConfiguration
  jackson:
    deserialization:
      # A misspelled field is an error, not a silently ignored setting (spec §5.2).
      fail-on-unknown-properties: true

springdoc:
  # The committed ../openapi.json documents the management API only; it feeds
  # frontend codegen (Orval). Serving endpoints get their own generated docs (spec §10).
  paths-to-match: /admin/api/**
  api-docs:
    path: /admin/api/openapi.json
  writer-with-order-by-keys: true

server:
  port: 8520
  shutdown: graceful
  servlet:
    session:
      timeout: 8h
      cookie:
        name: OPENDBAPI_SESSION
        http-only: true
        same-site: lax
        secure: ${OPENDBAPI_SECURE_COOKIES:false}

management:
  tracing:
    sampling:
      probability: ${OPENDBAPI_TRACE_SAMPLING:0.1}
  metrics:
    distribution:
      percentiles-histogram:
        opendbapi.request.duration: true
        opendbapi.db.duration: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    ldap:
      enabled: false
